name: Frontend Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fix: removed `cache: npm` / `cache-dependency-path`, which failed with
      # "Some specified paths were not resolved" because frontend/package-lock.json
      # was not found. Once you commit a lockfile, you can re-add:
      #   cache: npm
      #   cache-dependency-path: frontend/package-lock.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` requires a lockfile; `npm install` works without one.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint src --ext .js,.jsx
