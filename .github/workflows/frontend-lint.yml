name: Frontend Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Fix: ESLint had no config file. This installs ESLint + React plugins
      # for CI only. Commit frontend/.eslintrc.json (provided separately).
      # Better long-term: add these as devDependencies in package.json
      #   npm install -D eslint@8 eslint-plugin-react eslint-plugin-react-hooks
      - name: Install ESLint and React plugins
        run: npm install --no-save eslint@8 eslint-plugin-react eslint-plugin-react-hooks

      - name: Lint
        run: npx eslint src --ext .js,.jsx
